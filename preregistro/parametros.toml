# Parâmetros pré-registrados da Fase 1.
#
# Fonte: specs/00-plataforma/fase-1-requirements.md, versão 1.3 (aprovada em
# 2026-10-07), §7.2 (parâmetros) e §7.3 (filtros), mais a regra de nomes da Binance
# de fase-1-design.md, versão 1.0, §3.3. Cada valor diz de onde vem.
#
# Regras (CLAUDE.md §2 e §3, design §3.9):
# - Este arquivo é a única fonte de parâmetro pré-registrado. Nenhum limiar aparece
#   como literal no código.
# - Nenhum valor muda depois que uma janela de avaliação foi lida. Antes disso, só
#   por emenda dos requisitos, com versão nova.
# - copylab.params o carrega num modelo imutável e expõe o hash dos valores, em
#   forma canônica: comentário, ordem e formatação não mudam o hash; um valor muda.
#
# Unidades vão no nome da chave: _usd, _bps, _pct (por cento, como a spec escreve),
# _pp (pontos percentuais), _s (segundos), _h (horas), _days (dias UTC).
# Datas são dias UTC. As janelas da spec estão escritas como ela as escreve, com o
# primeiro e o último dia inclusive; o carregador confere as contagens de dias e as
# converte em janelas semiabertas [início, fim).

# ─── Universo (§7.2 "Universo"; RF-SEL-08 CA-08.1; RF-ING-06 CA-06.3) ─────────

[universe]
# "no máximo 20 ativos" — RF-SEL-08 CA-08.1 (ii)
max_assets = 20
# "mínimo de 2.000 fills de candidatas por ativo" — RF-SEL-08 CA-08.1 (iii)
min_candidate_fills = 2000
# "desvio do proxy de até 10 bps" — p95 do desvio em relação à mediana do dia,
# RF-ING-06 CA-06.3
proxy_max_deviation_p95_bps = 10.0
# "nível de até 50 bps" — módulo da mediana diária, RF-ING-06 CA-06.3
proxy_max_level_bps = 50.0

# ─── Rota A (§7.2) ─────────────────────────────────────────────────────────────

[route_a]
# "Rota A — janela de seleção: 2026-07-01 a 2026-08-31 (UTC), 62 dias"
selection_first_day = 2026-07-01
selection_last_day = 2026-08-31
selection_days = 62
# "Rota A — corte T: 2026-09-01 00:00 UTC"
cutoff = 2026-09-01
# "Rota A — janela de avaliação: 2026-09-01 a 2026-09-30 (UTC), 30 dias"
evaluation_first_day = 2026-09-01
evaluation_last_day = 2026-09-30
evaluation_days = 30

# ─── Rota B (§7.2) ─────────────────────────────────────────────────────────────

[route_b]
# "Rota B — janela de seleção: os 62 dias que terminam no corte da Rota B". O corte
# é argumento de `select --route B --cutoff` (RF-CLI-01), não parâmetro.
selection_days = 62
# "Rota B — janela de avaliação: 30 dias a partir da primeira meia-noite UTC após a
# publicação do congelamento"
evaluation_days = 30
# "Rota B — cobertura mínima do livro: 95% do tempo por ativo"
min_book_coverage_pct = 95.0
# "a janela se estende até completar 30 dias de cobertura, no máximo por 15 dias"
max_extension_days = 15

[live_week]
# "Semana ao vivo: os primeiros 7 dias de cobertura efetiva da janela de avaliação da
# Rota B, com extensão máxima de 3 dias"
days = 7
max_extension_days = 3

# ─── Gate do piloto (§7.2; RF-ANA-08 CA-08.1) ─────────────────────────────────

[pilot_gate]
# "Gate do piloto — perda máxima na semana: 10% (retorno simulado com o livro ≥ −10%)"
max_week_loss_pct = 10.0
# "Gate do piloto — diferença entre fontes de preço: 1 ponto percentual, em módulo"
max_source_difference_pp = 1.0
# "Capital real máximo do piloto: US$ 50" — D13
max_real_capital_usd = 50.0

# ─── Pool de candidatas (§7.2; RF-SEL-07; D17) ────────────────────────────────

[pool]
# "3.000 carteiras do pool F2, sorteadas com a semente 20261005, em blocos adicionais
# de 3.000 enquanto houver menos de 20 elegíveis"
block_size = 3000
seed = 20261005
min_eligible = 20

[ingestion]
# "Teto de fills por carteira na janela: 20.000" — RF-ING-02 CA-02.3; também o
# "no máximo 20.000 fills" de F3
max_fills_per_wallet = 20000

[reconciliation]
# "Tolerância de conciliação de PnL: 10 bps do notional do episódio" — D20,
# RF-ING-04 CA-04.2; também o "PnL conciliado" de F3
pnl_tolerance_bps = 10.0

# ─── Coorte e capital (§7.2; D11, D14) ────────────────────────────────────────

[cohort]
# "K (carteiras na coorte): min(5, ⌊capital / 50⌋), com mínimo de 1"
max_k = 5
capital_per_wallet_usd = 50.0
min_k = 1

[capital]
# "Capital (simulado): primário US$ 50, com K = 1. Grade: 50 / 100 / 500, com
# K = 1 / 2 / 5". O carregador confere grid_k contra a fórmula de [cohort].
primary_usd = 50.0
grid_usd = [50.0, 100.0, 500.0]
grid_k = [1, 2, 5]

[delay]
# "Δ: primário 5 s; grade 1 / 5 / 30 s"
primary_s = 5
grid_s = [1, 5, 30]

# A composição da grade de cenários (§7.2 "Grade de cenários": os nove pares de capital
# e Δ com o slippage primário, a sensibilidade de slippage só no capital e no Δ
# primários, a variante só compras em todos) é estrutura, e não valor: está no design
# §3.8 e é montada a partir de [capital], [delay] e [slippage].

[slippage]
# "Slippage (Rota A): primário, por ativo: o maior entre 2 bps e a mediana do
# meio-spread medido pelo coletor em ao menos 3 dias [...]. Sensibilidade: zero e o
# dobro do primário" — D21, RF-COL-05 CA-05.2
floor_bps = 2.0
min_measured_days = 3
sensitivity_multipliers = [0.0, 2.0]

[fees]
# "Taxa taker: 4,5 bps" — premissa 1
taker_bps = 4.5

[mirror]
# "Teto de alavancagem: 1,0" — ADR-0002
leverage_cap = 1.0
# "Exposição no pico: 1,0" — ADR-0002
peak_exposure = 1.0
# "Ordem mínima: US$ 10" — premissa 2
min_order_usd = 10.0

[ranking]
# "Ranking: Sharpe diário da cópia simulada na janela de seleção" — RF-SEL-04 CA-04.1
metric = "daily_sharpe"

[control]
# "Coortes de controle: 1.000, semente 20261005" — RF-SEL-06
cohorts = 1000
seed = 20261005

[metrics]
# "Anualização: √365, dia UTC" — RF-ANA-01 CA-01.1
annualization_days = 365

# ─── Filtros de elegibilidade (§7.3; D15) ─────────────────────────────────────
# F3 não tem chave própria: os limiares dele são [ingestion] e [reconciliation].

[filters]
# F1 "Tipo de conta: usuário comum (exclui vault e subconta)". O valor é o que a API
# devolve para usuário comum (`userRole == "user"`, docs/verificacao-de-dados.md,
# RF-VER-02).
f1_role = "user"
# F2 "Patrimônio no snapshot: ≥ US$ 30.000"
f2_min_account_value_usd = 30000.0
# F4 "Episódios fechados no universo: ≥ 20"
f4_min_closed_episodes = 20
# F5 "Regularidade: abre episódio em ≥ 6 dos 8 blocos completos de 7 dias"
f5_blocks = 8
f5_block_days = 7
f5_min_active_blocks = 6
# F6 "Duração mediana do episódio: entre 1 hora e 7 dias"
f6_min_median_duration_h = 1.0
f6_max_median_duration_days = 7.0
# F7 "Entradas a mercado: ≥ 50% do notional de abertura com crossed = true"
f7_min_taker_opening_pct = 50.0
# F8 "Concentração: mediana de até 3 perpétuos abertos ao mesmo tempo"
f8_max_median_open_perps = 3
# F9 "Cobertura do universo: ≥ 50% do notional da carteira em ativos do universo"
f9_min_universe_notional_pct = 50.0
# F10 "Liquidações: nenhum fill em que a carteira é a liquidada"
f10_max_liquidated_fills = 0

# ─── Nomes na Binance (design §3.3, "Quais ativos recebem proxy") ─────────────

[binance]
# "o mesmo nome com USDT, o prefixo k trocado por 1000, e as exceções listadas"
quote = "USDT"
k_prefix = "k"
k_replacement = "1000"
# Exceções: nenhuma. Os 27 perpétuos com equivalente encontrados na verificação seguem
# a regra (docs/verificacao-de-dados.md, RF-VER-05 CA-05.4; kBONK e kPEPE viram
# 1000BONKUSDT e 1000PEPEUSDT). Uma exceção entra assim, por emenda:
#   [[binance.exceptions]]
#   coin = "..."
#   symbol = "..."
exceptions = []
